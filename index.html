<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة الطلاب</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1c2b2a;--mu:#6b7776;--ac:#0f766e;--bd:#e3dfd5;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121917;--card:#1b2523;--tx:#e8efed;--mu:#9bb0ac;--ac:#2dd4bf;--bd:#2d3b38;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#121917;--card:#1b2523;--tx:#e8efed;--mu:#9bb0ac;--ac:#2dd4bf;--bd:#2d3b38;--ok:#4ade80;--no:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;line-height:1.6}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
button{cursor:pointer}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
.on{border-color:var(--ac);outline:2px solid var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r>*{width:100%}
.full{grid-column:1/-1}
.mu{color:var(--mu);font-size:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;border:1px solid var(--bd)}
.ok{color:var(--ok)}.no{color:var(--no)}
.rec{border-top:1px dashed var(--bd);padding:10px 0}
.rec:first-child{border-top:0}
.sl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hide{display:none}
.vx{position:relative;overflow:hidden;min-height:240px;display:flex;align-items:center;justify-content:center;text-align:center;background:#02100a!important;border:1px solid #00ff9c!important;box-shadow:0 0 18px #00ff9c88,inset 0 0 30px #00ff9c33;animation:nb 2.4s ease-in-out infinite alternate}
.vx canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.vxc{position:relative;z-index:2;padding:10px}
.vxs{font-family:ui-monospace,Consolas,monospace;color:#00ff9c;font-size:13px;letter-spacing:3px;direction:ltr;min-height:20px}
.vx .mu{color:#7dffc8;font-family:ui-monospace,Consolas,monospace}
.gl{position:relative;font-family:ui-monospace,Consolas,monospace;font-size:40px;font-weight:800;color:#e8fff5;text-shadow:0 0 12px #00ff9c;margin:8px 0;direction:ltr;animation:gk 3s infinite}
.gl::before,.gl::after{content:attr(data-text);position:absolute;inset:0;overflow:hidden}
.gl::before{color:#ff2d6f;animation:g1 2.2s infinite linear alternate-reverse}
.gl::after{color:#00e5ff;animation:g2 1.9s infinite linear alternate-reverse}
@keyframes nb{to{box-shadow:0 0 34px #00ff9c,inset 0 0 44px #00ff9c55}}
@keyframes g1{0%{clip-path:inset(0 0 80% 0);transform:translate(-3px,0)}20%{clip-path:inset(30% 0 40% 0);transform:translate(3px,0)}40%{clip-path:inset(60% 0 10% 0);transform:translate(-2px,0)}60%{clip-path:inset(10% 0 70% 0);transform:translate(4px,0)}80%{clip-path:inset(45% 0 30% 0);transform:translate(-4px,0)}100%{clip-path:inset(0 0 55% 0);transform:translate(2px,0)}}
@keyframes g2{0%{clip-path:inset(70% 0 5% 0);transform:translate(3px,0)}25%{clip-path:inset(15% 0 60% 0);transform:translate(-3px,0)}50%{clip-path:inset(50% 0 20% 0);transform:translate(4px,0)}75%{clip-path:inset(5% 0 80% 0);transform:translate(-4px,0)}100%{clip-path:inset(40% 0 35% 0);transform:translate(2px,0)}}
@keyframes gk{0%,92%,100%{transform:none}94%{transform:skewX(8deg)}96%{transform:skewX(-6deg) translateX(3px)}}
@media (prefers-reduced-motion:reduce){.vx,.gl,.gl::before,.gl::after{animation:none}}
#fx{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,20,18,.85)}
#fx.go{display:flex;animation:fi .25s ease}
#fx .ic{font-size:76px;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#fx .wl{color:#fff;font-weight:700;font-size:20px;margin-top:8px;animation:fi .6s .3s both}
#fx .ring{position:absolute;width:90px;height:90px;border-radius:50%;border:3px solid var(--ac);animation:rg 1s ease-out forwards}
#fx .r2{animation-delay:.2s}
#fx .pt{position:absolute;width:9px;height:9px;border-radius:50%;animation:pt 1.1s ease-out forwards}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes rg{from{transform:scale(.3);opacity:1}to{transform:scale(5);opacity:0}}
@keyframes pt{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

<body>
<div class="w">

<div class="tabs"><button id="tP" class="on">👨‍👩‍👦 ولي الأمر</button><button id="tT">🧑‍🏫 المدرس</button><button id="tD">🎨 تصميم الموقع</button></div>

<section id="parent">

    <div class="mu" style="margin-bottom:8px">اكتب كود الطالب اللي المدرس إداهولك</div>

<section id="design" class="hide"><div class="c vx"><canvas id="mx"></canvas><div class="vxc"><div class="vxs">&gt; DESIGNED BY</div><div id="dn" class="gl"></div><div id="dp" class="mu" dir="ltr"></div><div class="vxs" id="tp"></div></div></div><div class="c hide" id="de"><b>تعديل بيانات المصمم</b><div class="r" style="margin-top:8px"><input id="dni" placeholder="اسم المصمم"><input id="dpi" placeholder="رقم التواصل" dir="ltr" inputmode="tel"><button class="p full" id="dsv">حفظ</button></div></div></section>

<section id="lock" class="hide"><div class="c"><b id="lt"></b><div class="r" style="margin-top:8px"><input type="password" id="pw" class="full" placeholder="كلمة السر"><button class="p full" id="pwb">دخول</button></div></div></section>

<div id="fx" aria-hidden="true"></div>
</div>
<script>
(function(){
var K="stu_db_v1",subs=[];
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}}
var mem=load();
function save(){try{localStorage.setItem(K,JSON.stringify(mem))}catch(e){}}
if(!mem.config||!mem.config.auth){mem.config={auth:{t:"e6b0a24f38b52c562c64208b9c077827c16697476e29af290b422ea9c9e52ea6",a:"4b5fedb22add87dbf7f123054f6e2a40b03eebd266af813ad41932762a403546",an:"\u0634\u0647\u062f"}}}
if(!mem.design||!mem.design.info){mem.design={info:{n:"Mr Virus",p:""}}}
save();
function notify(){subs.slice().forEach(function(f){f()})}
function snap(p,id){return {id:id,exists:!!(mem[p]&&mem[p][id]),data:function(){return mem[p]&&mem[p][id]?JSON.parse(JSON.stringify(mem[p][id])):undefined}}}
function sub(f){subs.push(f);setTimeout(f,0);return function(){subs=subs.filter(function(x){return x!==f})}}
function coll(p){return {
 doc:function(id){return {
  set:async function(d){(mem[p]=mem[p]||{})[id]=JSON.parse(JSON.stringify(d));save();notify()},
  update:async function(d){mem[p]=mem[p]||{};mem[p][id]=Object.assign({},mem[p][id]||{},d);save();notify()},
  delete:async function(){if(mem[p])delete mem[p][id];save();notify()},
  onSnapshot:function(cb){return sub(function(){cb(snap(p,id))})}}},
 onSnapshot:function(cb){return sub(function(){var ids=Object.keys(mem[p]||{});cb({docs:ids.map(function(i){return snap(p,i)}),size:ids.length,empty:!ids.length})})}}}
window.addEventListener("storage",function(e){if(e.key===K){mem=load();notify()}});
window.claude={use:async function(n){if(n==="db")return {collection:coll};if(n==="user")return {canEdit:function(){return false},isOwner:function(){return false}};return null}};
})();
</script>
<script>
(function(){
var S=[],R=[],db=null,isT=false;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dt(s){return s?s.split("-").reverse().join("/"):""}
function dd(d){return (d&&d.data)?(typeof d.data==="function"?d.data():d.data):{}}
$("rd").value=new Date().toISOString().slice(0,10);
var unlocked=false,cfg={},role="",PH={};
function fx(){return new Promise(function(res){var o=$("fx");if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches){res();return}
o.innerHTML='<div class="ring"></div><div class="ring r2"></div><div class="ic">🔓</div><div class="wl">'+(role==="a"?"أهلًا بيكي يا "+(cfg.an||"أسيستنت"):"أهلًا بيك يا مستر سيد")+'</div>';
var cl=["#2dd4bf","#fbbf24","#f472b6","#60a5fa","#a3e635"];
for(var i=0;i<26;i++){var a=Math.random()*6.283,d=110+Math.random()*130,p=document.createElement("span");p.className="pt";p.style.background=cl[i%5];p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d+"px");o.appendChild(p)}
o.classList.add("go");setTimeout(function(){o.classList.remove("go");o.innerHTML="";res()},1600)})}
function show(t){var l=t&&!unlocked;$("parent").classList.toggle("hide",t);$("teacher").classList.toggle("hide",!t||l);$("lock").classList.toggle("hide",!l);$("tP").classList.toggle("on",!t);$("tT").classList.toggle("on",t);$("design").classList.add("hide");$("tD").classList.remove("on");if(l)updLock()}
async function hash(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("stu:"+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function updLock(){var nt=!cfg.t&&isT,has=cfg.t||cfg.a;$("lt").textContent=nt?"اختار كلمة سر المدرس (4 حروف على الأقل)":(has?"اكتب كلمة السر":"لسه مفيش كلمة سر. المدرس لازم يسجل دخوله ويعملها أول مرة.");var ok=nt||has;$("pw").classList.toggle("hide",!ok);$("pwb").classList.toggle("hide",!ok)}
$("pwb").onclick=async function(){var v=$("pw").value;if(!v)return;try{var h=await hash(v);if(cfg.t&&h===cfg.t){role="t";unlocked=true}else if(cfg.a&&h===cfg.a){role="a";unlocked=true}else if(!cfg.t&&isT&&db&&v.length>=4){await db.collection("config").doc("auth").update({t:h});role="t";unlocked=true}else{$("msg").textContent="كلمة السر غلط";return}$("pw").value="";$("msg").textContent="";await fx();show(true)}catch(e){$("msg").textContent="حصلت مشكلة، حاول تاني"}};
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("pwb").click()});
$("tP").onclick=function(){show(false)};$("tT").onclick=function(){show(true)};
$("tD").onclick=function(){$("parent").classList.add("hide");$("teacher").classList.add("hide");$("lock").classList.add("hide");$("design").classList.remove("hide");$("tP").classList.remove("on");$("tT").classList.remove("on");$("tD").classList.add("on");$("de").classList.toggle("hide",!unlocked);startMx();typeTp()};
var mxOn=false;
function startMx(){var c=$("mx");if(!c||mxOn)return;if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;mxOn=true;var x=c.getContext("2d"),w=c.width=c.offsetWidth,h=c.height=c.offsetHeight,fs=16,cols=Math.floor(w/fs),dr=[],ch="01<>/*#$%&{}[]",last=0;for(var i=0;i<cols;i++)dr[i]=Math.random()*h/fs;
(function f(t){if($("design").classList.contains("hide")){mxOn=false;return}if(t-last>55){last=t;x.fillStyle="rgba(2,16,10,.18)";x.fillRect(0,0,w,h);x.fillStyle="#00ff9c";x.font=fs+"px monospace";for(var i=0;i<cols;i++){x.fillText(ch.charAt(Math.floor(Math.random()*ch.length)),i*fs,dr[i]*fs);if(dr[i]*fs>h&&Math.random()>.975)dr[i]=0;dr[i]++}}requestAnimationFrame(f)})(0)}
function typeTp(){var s="[ SYSTEM ONLINE ] ACCESS GRANTED",e=$("tp"),i=0;e.textContent="";(function n(){if(i<=s.length){e.textContent=s.slice(0,i++)+"_";setTimeout(n,45)}else e.textContent=s})()}
$("dsv").onclick=async function(){if(!db)return;try{await db.collection("design").doc("info").set({n:$("dni").value.trim(),p:$("dpi").value.trim()});$("msg").textContent="تم الحفظ ✓"}catch(x){$("msg").textContent="تعذر الحفظ"}};
function renderParent(){
  var c=$("code").value.trim(),o=$("pOut");
  if(!c){o.innerHTML="";return}
  var st=S.filter(function(s){return s.code===c})[0];
  if(!st){o.innerHTML='<div class="c no">الكود غير صحيح أو لسه مفيش بيانات.</div>';return}
  var rs=R.filter(function(r){return r.sid===st.id}).sort(function(a,b){return a.date<b.date?1:-1});
  var pr=rs.filter(function(r){return r.att==="حاضر"}).length;
  var h='<div class="c"><b>'+esc(st.name)+'</b> <span class="mu">'+esc(st.grade)+'</span><div class="mu">أيام الحضور: '+pr+' من '+rs.length+'</div></div><div class="c">';
  if(!rs.length)h+='<div class="mu">لسه مفيش تقارير يومية.</div>';
  rs.forEach(function(r){h+='<div class="rec"><div class="sl"><b>'+dt(r.date)+'</b><span class="tag '+(r.att==="حاضر"?"ok":"no")+'">'+esc(r.att)+'</span></div><div class="mu">الواجب: '+esc(r.hw)+(r.grade?' · الدرجة: '+esc(r.grade):'')+(r.beh?' · السلوك: '+esc(r.beh):'')+'</div>'+(r.note?'<div>'+esc(r.note)+'</div>':'')+'</div>'});
  o.innerHTML=h+'</div>';
}
function renderTeacher(){
  $("rs").innerHTML=S.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>'}).join("")||'<option value="">أضف طالب أولًا</option>';
  $("list").innerHTML=S.map(function(s){return '<div class="rec sl"><span>'+esc(s.name)+' <span class="mu">'+esc(s.grade)+'</span>'+(s.by?'<br><span class="mu">أضافه: '+esc(s.by)+'</span>':'')+'</span><span class="tag">كود: '+esc(s.code)+'</span><button class="del" data-id="'+esc(s.id)+'" style="padding:4px 10px;margin-inline-start:6px">🗑️ حذف</button></div>'+(PH[s.id]?'<div class="mu" dir="ltr" style="text-align:right">📞 <a href="tel:'+esc(PH[s.id])+'">'+esc(PH[s.id])+'</a></div>':'')}).join("")||'<div class="mu">مفيش طلاب.</div>';
}
function all(){renderParent();renderTeacher()}
var pend=null,pt=0;
$("list").onclick=async function(e){var b=e.target.closest(".del");if(!b||!db)return;var id=b.dataset.id;
if(pend!==id){pend=id;b.textContent="تأكيد الحذف؟";b.classList.add("p");clearTimeout(pt);pt=setTimeout(function(){pend=null;renderTeacher()},4000);return}
clearTimeout(pt);pend=null;b.disabled=true;
try{var rs=R.filter(function(r){return r.sid===id});
for(var i=0;i<rs.length;i++){await db.collection("records").doc(rs[i].sid+"_"+rs[i].date).delete()}
try{await db.collection("data/private/phones").doc(id).delete()}catch(x){}
await db.collection("students").doc(id).delete();
$("msg").textContent="تم حذف الطالب"}catch(x){$("msg").textContent="تعذر الحذف ("+((x&&(x.code||x.message))||x)+")";renderTeacher()}};
$("go").onclick=renderParent;
$("code").addEventListener("keydown",function(e){if(e.key==="Enter")renderParent()});
$("addS").onclick=async function(){
  var n=$("sn").value.trim();if(!n||!db)return;
  var id="s"+Date.now(),code=$("sc").value.trim();if(!code){$("msg").textContent="اكتب كود الطالب";return}if(S.some(function(s){return s.code===code})){$("msg").textContent="الكود ده مستخدم لطالب تاني";return}$("msg").textContent="";
  try{await db.collection("students").doc(id).set({name:n,grade:$("sg").value.trim(),code:code,by:(role==="a"?(cfg.an||"الأسيستنت"):"مستر سيد")});var p=$("sp").value.trim();if(p)await db.collection("data/private/phones").doc(id).set({p:p});$("sn").value="";$("sg").value="";$("sp").value="";$("sc").value=""}catch(e){$("msg").textContent="تعذر الحفظ"}
};
$("addR").onclick=async function(){
  var sid=$("rs").value;if(!sid||!db)return;
  var d=$("rd").value;
  try{await db.collection("records").doc(sid+"_"+d).set({sid:sid,date:d,att:$("ra").value,hw:$("rh").value,grade:$("rg").value.trim(),beh:$("rb").value.trim(),note:$("rn").value.trim()});
  $("rg").value="";$("rb").value="";$("rn").value="";$("msg").textContent="تم الحفظ ✓"}catch(e){$("msg").textContent="تعذر الحفظ"}
};
(async function(){
  try{
    var u=await claude.use("user");isT=!!(u&&u.canEdit&&u.canEdit());
    if(isT)$("tT").classList.remove("hide");
  }catch(e){}
  try{
    db=await claude.use("db");
    if(!db){$("msg").textContent="البيانات غير متاحة حاليًا";return}
    db.collection("students").onSnapshot(function(sn){S=sn.docs.map(function(d){var x=dd(d);x.id=d.id;return x});all()},function(){$("msg").textContent="تعذر تحميل الطلاب"});
    db.collection("records").onSnapshot(function(sn){R=sn.docs.map(function(d){return dd(d)});all()},function(){});
    db.collection("config").doc("auth").onSnapshot(function(d){var x=dd(d)||{};cfg={t:x.t||null,a:x.a||x.h||null,an:x.an||""};updLock()},function(){});
    db.collection("data/private/phones").onSnapshot(function(sn){PH={};sn.docs.forEach(function(d){PH[d.id]=(dd(d)||{}).p});renderTeacher()},function(){});
    db.collection("design").doc("info").onSnapshot(function(d){var x=dd(d)||{};$("dn").textContent=x.n||"لسه ما اتضافش اسم المصمم";$("dp").textContent=x.p||"";$("dn").setAttribute("data-text",$("dn").textContent);if(x.n&&!$("dni").value)$("dni").value=x.n;if(x.p&&!$("dpi").value)$("dpi").value=x.p},function(){});
  }catch(e){$("msg").textContent="البيانات غير متاحة حاليًا"}
})();
})();
</script>
